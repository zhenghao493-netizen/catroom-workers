<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf3f6"><title>猫猫开局 · 飞行棋朋友房</title><link rel="stylesheet" href="./style-0.css?v=050"><link rel="stylesheet" href="./style-1.css?v=050"><link rel="stylesheet" href="./style-2.css?v=050"><link rel="stylesheet" href="./online.css?v=050"><link rel="stylesheet" href="./compact.css?v=051"><meta name="catroom-ui" content="compact-1"></head>
<body data-theme="day" class="flight-compact"><main class="app">
<header class="top"><span class="brand-symbol" data-icon="plane"></span><div class="brand-name">猫猫开局<small>CATROOM · FLIGHT CLUB</small></div><button class="labtag" id="connectionStatus" type="button"><i></i>连接房间中</button><button id="displaySettings" class="compact-menu" type="button" aria-haspopup="dialog" aria-controls="toolsDialog" aria-label="主题、规则与房间菜单">更多</button></header>
<div class="title-row"><h1>飞行棋<span>四色航线，清楚每一步。</span></h1><div class="theme-switch" aria-label="外观风格"><button data-theme="day" aria-pressed="true">晴空</button><button data-theme="night" aria-pressed="false">夜航</button><button data-theme="cream" aria-pressed="false">奶油</button></div></div>
<div class="layout"><section class="left">
<div class="gamebar"><div class="turn-title"><span class="turn-dot" id="turnDot"></span><div><strong id="turnTitle">轮到你了</strong><small id="turnSub">红方 · 选择发光的飞机</small></div></div><span class="you-badge" id="modeTag"><span class="room-clock">不限时</span></span><button class="routebtn" id="routeToggle" aria-pressed="true"><span data-icon="route"></span>航线提示</button></div>
<div class="board-slot"><div class="board-shell"><div class="board" id="board"><svg viewBox="0 0 600 600" id="boardArt" aria-label="经典飞行棋棋盘"></svg><svg viewBox="0 0 600 600" id="pathArt" aria-hidden="true" style="pointer-events:none;z-index:3"></svg><div class="token-layer" id="tokens"></div></div></div></div>
<div class="board-caption"><span><i></i><b id="ownCaption">红方是你 · 发光的才能走</b></span><span>外圈顺时针 · 彩色直道回家</span></div>
<div class="seat-grid" id="seats"></div>
</section><aside class="right"><section class="panel control-panel"><div class="eyebrow">YOUR FLIGHT</div><div class="control-heading"><h2 id="actionHeading">选择一架飞机</h2></div><div class="dice-row"><div class="die" id="die" role="img" aria-label="3 点"></div><div class="dice-copy"><strong id="dieTitle">掷出了 3 点</strong><p id="dieDesc">白圈是可走，金圈是已选。<br>先看落点，再确认。</p></div></div><div class="piece-choices" id="choices" aria-label="飞机选择"></div><button class="main-action" id="mainAction" disabled>先选择发光的飞机</button><div class="selection-note" id="selectionNote" role="status" aria-live="polite">点击棋盘，或用上方大按钮选择。</div><div class="panel-actions"><button class="text-btn" id="backRoom"><span data-icon="refresh"></span>房间菜单</button><button class="text-btn" id="rules"><span data-icon="book"></span>本版规则</button><button class="text-btn" id="chatOpen"><span data-icon="volume"></span>聊天弹幕</button></div></section>
<section class="panel chat-panel"><div class="section-label">房间聊天<span id="chatCount"></span></div><ol id="chatLog" aria-live="polite"></ol><form id="chatForm"><input id="chatInput" maxlength="120" placeholder="发条弹幕，说点什么…" aria-label="聊天内容" autocomplete="off"><button type="submit">发送</button></form><label class="danmaku-option"><input id="danmakuToggle" type="checkbox" checked> 显示弹幕</label></section><section class="log"><div class="log-title">最近行动</div><ol id="log"></ol></section></aside></div>
<footer class="footer"><span>服务器统一裁定 · v0.5.0 / UI 051</span><button id="credits">规则与素材说明</button></footer>
</main><div id="danmaku" aria-hidden="true"></div><dialog id="dialog"></dialog><dialog id="toolsDialog" class="support-dialog" aria-labelledby="toolsTitle"><div class="dialog-head"><h2 id="toolsTitle">显示与房间</h2><button id="toolsClose" class="close" type="button" aria-label="关闭菜单">×</button></div><div id="toolsTheme"></div><div id="toolsActions"></div><div id="toolsLog"></div><div id="toolsCredits"></div></dialog><dialog id="chatDialog" class="support-dialog" aria-labelledby="chatTitle"><div class="dialog-head"><h2 id="chatTitle">房间聊天</h2><button id="chatClose" class="close" type="button" aria-label="关闭聊天">×</button></div><div id="chatSlot"></div></dialog><div class="toast" id="toast" role="status"></div><noscript>请启用 JavaScript 后进入联机房间。</noscript>
<script type="module" src="./online.js?v=051"></script></body></html>
